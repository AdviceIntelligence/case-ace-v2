events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Hardened Security & CSP Headers
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://api.caseace.adviceintelligence.tech https://caseace.adviceintelligence.tech https://europe-west2-speech.googleapis.com https://europe-west2-aiplatform.googleapis.com https://webexapis.com; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), display-capture=(), microphone=(self)" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache control for immutable static assets (C1 compliance)
        location ~* \.(js|css|wasm|woff2|png|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
