# Cloud Build definition for the Case Ace v2.0 backend container image.
#
# The build runs in Google Cloud, not on a workstation, so no local Docker
# installation is required. Invoke with:
#
#   gcloud builds submit --project=case-ace-v2 --region=europe-west2 \
#     --config=infrastructure/gcp/cloudbuild.yaml \
#     --substitutions=_TAG=2.0.0
steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -f
      - infrastructure/docker/Dockerfile.backend
      - -t
      - ${_IMAGE}:${_TAG}
      - -t
      - ${_IMAGE}:latest
      - .
  - name: gcr.io/cloud-builders/docker
    id: push-tag
    args: [push, '${_IMAGE}:${_TAG}']
  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args: [push, '${_IMAGE}:latest']
substitutions:
  _IMAGE: europe-west2-docker.pkg.dev/case-ace-v2/case-ace/backend
  _TAG: '2.0.0'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1200s
